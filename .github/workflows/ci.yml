name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: make lint
      - name: Verify (tests, live server, real MCP call)
        run: make verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aawiz-voice-checkin .
      - name: Run and check both services
        run: |
          docker run -d --name avc -p 8000:8000 -p 8001:8001 aawiz-voice-checkin
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8001/health && exit 0
            sleep 2
          done
          docker logs avc
          exit 1
      - name: Build the hosted demo image
        run: docker build -f deploy/Dockerfile.demo -t aawiz-demo .
      - name: Run the hosted demo on the platform's PORT, without a key
        run: |
          docker run -d --name demo -e PORT=10000 -p 10000:10000 aawiz-demo
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              curl -fsS http://127.0.0.1:10000/api/config | tee config.json
              grep -q '"demo"' config.json
              curl -fsS -X POST http://127.0.0.1:10000/api/turn                 -H 'Content-Type: application/json'                 -d '{"session":"ci-visitor-0123456789","text":"How was my week?"}' | tee turn.json
              grep -q 'get_weekly_reflection' turn.json
              exit 0
            fi
            sleep 2
          done
          docker logs demo
          exit 1
